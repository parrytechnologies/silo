[project]
name = "silo-search"
version = "0.3.0"
description = "SILO — Search and Indexing, Local-Only. CPU-only, air-gapped document search: Docling parsing, hybrid BM25 + vector retrieval, optional LLM answers."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Parry Technologies", email = "parryh@parrytech.co" }]
requires-python = ">=3.11,<3.14"
keywords = ["search", "rag", "mcp", "hybrid-search", "docling", "lancedb", "air-gapped", "on-prem", "local-first"]
dependencies = [
    "docling>=2.40",
    "fastembed>=0.6",
    "lancedb>=0.24",
    "pyarrow>=16",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "typer>=0.15",
    "rich>=13",
    "httpx>=0.27",
    "huggingface-hub>=0.26",
    "mcp>=1.2",
    "torch>=2.4",
    "torchvision>=0.19",
]

[project.urls]
Homepage = "https://parrytech.co/blog/silo-air-gapped-document-search"
Repository = "https://github.com/parrytechnologies/silo"

[project.scripts]
silo = "silo.cli:app"

[dependency-groups]
dev = ["pytest>=8", "reportlab>=4", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/silo"]

# Linux wheels of torch default to multi-gigabyte CUDA builds. SILO is CPU-only,
# so pin Linux to the CPU wheel index. macOS and Windows wheels are already CPU/MPS.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
